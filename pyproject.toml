[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-python"
version = "0.1.0"
description = "Sample Python project for dependency vulnerability scanning"
requires-python = ">=3.8"
dependencies = [
    "requests==2.19.1",
    "urllib3==1.24.1",
    "Jinja2==2.10",
    "PyYAML==5.4.1",
]

[project.scripts]
sample-app = "main:main"
